    post:
      summary: Record reviewed payment/work/withdrawal reversal, supplier refund
        receipt, or full pre-production customer cancellation refund; no bank
        transfer is initiated
      security: *a1
      x-permission: finance.approve; customer_refund additionally orders.approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - customer_payment_reversal
                    - supplier_payment_reversal
                    - labour_payment_reversal
                    - withdrawal_reversal
                    - work_entry_reversal
                    - supplier_refund
                    - customer_refund
                source_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                posting_date:
