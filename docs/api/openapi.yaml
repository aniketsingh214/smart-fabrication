openapi: 3.1.0
info:
  title: SmartFabrication API
  version: 0.1.0
  description: Implemented local API contracts. Supabase RLS and server permission
    checks apply; cookie writes require same-origin requests. Full production
    acceptance remains pending.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
paths:
  /admin/estimate-history:
    get:
      summary: List Estimate history
      security: &a1
        - bearerAuth: []
        - cookieAuth: []
      x-permission: materials.read
      responses:
        "200":
          description: Explicit projected resource DTO; collection continuation is in
            meta.nextCursor
          content:
            application/json:
              schema:
                type: object
                required: &a2
                  - data
                  - meta
                  - requestId
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/estimate_history_record"
                  meta: &a3
                    type: object
                    properties:
                      nextCursor:
                        type:
                          - string
                          - "null"
                  requestId: &a4
                    type: string
                    format: uuid
        "400": &a5
          description: HTTP 400; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": &a6
          description: HTTP 401; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": &a7
          description: HTTP 403; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": &a8
          description: HTTP 404; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": &a9
          description: HTTP 409; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": &a10
          description: HTTP 413; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415": &a11
          description: HTTP 415; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422": &a12
          description: HTTP 422; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": &a13
          description: HTTP 429; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": &a14
          description: HTTP 500; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": &a15
          description: HTTP 503; sanitized error envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters: &a16
        - &a19
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - &a20
          name: cursor
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Text search on resources with a name/heading field
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          schema:
            type: string
