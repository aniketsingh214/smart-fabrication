  /finance/reconciliation:
    get:
      summary: Current scoped inventory/job-cost/purchase-tax reconciliation
      security: *a1
      x-permission: finance.read
      responses:
        "200":
          description: Exact minor-unit strings; unavailable scopes are null
          content:
            application/json:
              schema:
                type: object
                required: *a2
                properties:
                  data:
                    $schema: https://json-schema.org/draft/2020-12/schema
                    type: object
                    properties:
                      as_of:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                      currency:
                        type: string
                        const: INR
                      scope:
                        type: string
                        const: current_operational_snapshot
                      official_accounts:
                        type: boolean
                        const: false
                      inventory:
                        anyOf:
                          - type: object
                            properties:
                              book_value_minor:
                                type: string
                                pattern: ^-?\d+$
                              material_pools:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              negative_quantity_pools:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              negative_value_pools:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                              legacy_movements:
                                type: integer
                                minimum: 0
                                maximum: 9007199254740991
                            required:
                              - book_value_minor
                              - material_pools
                              - negative_quantity_pools
                              - negative_value_pools
                              - legacy_movements
                            additionalProperties: false
                          - type: "null"
                      job_costs:
                        anyOf:
                          - type: object
                            properties:
                              open_job_cost_minor:
                                type: string
                                pattern: ^-?\d+$
                              completed_job_cost_minor:
                                type: string
                                pattern: ^-?\d+$
                              cancelled_job_cost_minor:
                                type: string
